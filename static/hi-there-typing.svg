<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 550 50'
    style='background-color: #00000000;'
    width='550px' height='50px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='5300ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h550 ; m0,25 h550 ; m0,25 h0' keyTimes='0;0.75471698113208;0.81132075471698;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#1CD30D' font-size='20'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            👋 Hi there,
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='5300ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h550 ; m0,25 h550 ; m0,25 h0' keyTimes='0;0.75471698113208;0.81132075471698;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#1CD30D' font-size='20'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            😊 Thanks for visiting!
        </textPath>
    </text>
</svg>
